  <script>
    // A different meme from the guide each time the page opens. The block
    // stays hidden until an image actually loads; dead links get skipped.
    (function () {
      fetch('emails/memes.json')
        .then(function (r) { return r.ok ? r.json() : []; })
        .then(function (issues) {
          var pool = [];
          issues.forEach(function (issue) {
            issue.memes.forEach(function (m) { pool.push({ src: m.src, issue: issue }); });
          });
          tryOne(pool, 5);
        })
        .catch(function () {});

      function tryOne(pool, attempts) {
        if (!pool.length || !attempts) return;
        var pick = pool.splice(Math.floor(Math.random() * pool.length), 1)[0];
        var img = document.getElementById('home-meme-img');
        img.onload = function () {
          var issue = document.getElementById('home-meme-issue');
          issue.textContent = pick.issue.title;
          issue.href = 'emails/' + pick.issue.file;
          img.alt = 'Meme from ' + pick.issue.title;
          document.getElementById('home-meme').hidden = false;
        };
        img.onerror = function () { tryOne(pool, attempts - 1); };
        img.referrerPolicy = 'no-referrer';
        img.src = pick.src;
      }
    }());
  </script>
