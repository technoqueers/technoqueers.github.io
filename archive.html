<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Technoqueers — Archive</title>
  <meta content="Browse and search the Technoqueers email archive, 2016–2024." name="description">
  <meta content="width=device-width, initial-scale=1" name="viewport">
  <link href="css/normalize.css" rel="stylesheet" type="text/css">
  <link href="css/technoqueers.webflow.css" rel="stylesheet" type="text/css">
  <link href="images/favicon.png" rel="shortcut icon" type="image/x-icon">
  <style>
    *, *::before, *::after { box-sizing: border-box; }

    body {
      min-height: 100vh;
      background-color: #6e6e6e;
      margin: 0;
      padding: 0;
      font-family: Univers, sans-serif;
      color: #fff;
    }

    a { color: inherit; text-decoration: none; }

    .archive-wrap {
      max-width: 960px;
      margin: 0 auto;
      padding: 40px 24px 80px;
    }

    /* ── Header ── */
    .archive-header {
      display: flex;
      align-items: baseline;
      gap: 16px;
      margin-bottom: 36px;
    }

    .header-home {
      font-family: Univers, sans-serif;
      font-weight: 700;
      font-size: 17px;
      line-height: 17px;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      color: #fff;
    }

    .header-home:hover { color: #000; }

    .header-sep {
      font-family: Univers, sans-serif;
      font-weight: 700;
      font-size: 17px;
      color: rgba(255,255,255,0.35);
    }

    .header-label {
      font-family: Univers, sans-serif;
      font-weight: 700;
      font-size: 17px;
      line-height: 17px;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      color: rgba(255,255,255,0.5);
    }

    /* ── Search ── */
    .archive-search {
      margin-bottom: 32px;
    }

    .search-input {
      display: block;
      width: 100%;
      max-width: 480px;
      margin: 0 auto;
      height: 40px;
      padding: 0 20px;
      border: 1px solid #000;
      border-radius: 20px;
      background: transparent;
      font-family: Univers, sans-serif;
      font-weight: 700;
      font-size: 17px;
      line-height: 17px;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      color: #000;
      outline: none;
      -webkit-appearance: none;
      appearance: none;
    }

    .search-input::placeholder {
      color: rgba(0,0,0,0.35);
    }

    /* ── Layout ── */
    .archive-layout {
      display: flex;
      gap: 48px;
      align-items: flex-start;
    }

    /* ── Sidebar nav ── */
    .archive-nav {
      flex: 0 0 140px;
    }

    .nav-year {
      display: block;
      width: 100%;
      font-family: Univers, sans-serif;
      font-weight: 700;
      font-size: 17px;
      line-height: 17px;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      color: #fff;
      background: transparent;
      border: 1px solid transparent;
      border-radius: 10px;
      padding: 6px 10px;
      margin-bottom: 2px;
      cursor: pointer;
      text-align: left;
    }

    .nav-year:hover { background: rgba(0,0,0,0.15); }

    .nav-year.active {
      color: #000;
      background: #fff;
    }

    .nav-months {
      padding-left: 10px;
      margin-bottom: 8px;
      display: none;
    }

    .nav-months.open { display: block; }

    .nav-month {
      display: block;
      width: 100%;
      font-family: Univers, sans-serif;
      font-weight: 700;
      font-size: 13px;
      line-height: 13px;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      color: #d0d0d0;
      background: transparent;
      border: 1px solid transparent;
      border-radius: 8px;
      padding: 5px 8px;
      margin-bottom: 1px;
      cursor: pointer;
      text-align: left;
    }

    .nav-month:hover { color: #fff; background: rgba(0,0,0,0.15); }

    .nav-month.active {
      color: #000;
      background: rgba(255,255,255,0.8);
    }

    .nav-count {
      font-size: 11px;
      opacity: 0.55;
      margin-left: 3px;
    }

    /* ── Email list ── */
    .archive-list {
      flex: 1;
      min-width: 0;
    }

    .list-status {
      font-family: Univers, sans-serif;
      font-weight: 700;
      font-size: 13px;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      color: rgba(255,255,255,0.4);
      margin-bottom: 16px;
    }

    .group-header {
      font-family: Univers, sans-serif;
      font-weight: 700;
      font-size: 13px;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: rgba(255,255,255,0.4);
      padding: 16px 0 6px;
      border-bottom: 1px solid rgba(255,255,255,0.15);
      margin-bottom: 4px;
    }

    .group-header:first-child { padding-top: 0; }

    .email-item {
      display: flex;
      align-items: baseline;
      gap: 16px;
      padding: 7px 0;
      border-bottom: 1px solid rgba(0,0,0,0.12);
    }

    .email-date {
      flex: 0 0 94px;
      font-family: Univers, sans-serif;
      font-weight: 700;
      font-size: 13px;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      color: rgba(255,255,255,0.45);
      white-space: nowrap;
    }

    .email-title {
      font-family: Univers, sans-serif;
      font-weight: 700;
      font-size: 17px;
      line-height: 20px;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      color: #fff;
    }

    .email-title:hover { color: #000; }

    .email-body {
      flex: 1;
      min-width: 0;
    }

    .email-snippet {
      font-family: Univers, sans-serif;
      font-size: 14px;
      line-height: 19px;
      color: #e8e8e8;
      margin-top: 2px;
      overflow-wrap: anywhere;
    }

    .list-empty {
      font-family: Univers, sans-serif;
      font-weight: 700;
      font-size: 17px;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      color: rgba(255,255,255,0.35);
      padding: 20px 0;
    }

    /* ── Mobile ── */
    @media screen and (max-width: 767px) {
      .archive-wrap { padding: 24px 16px 60px; }

      .archive-layout {
        flex-direction: column;
        gap: 24px;
      }

      .archive-nav {
        flex: none;
        width: 100%;
        display: flex;
        flex-wrap: wrap;
        gap: 4px;
        align-items: flex-start;
      }

      .nav-year {
        flex: 0 0 auto;
        width: auto;
        margin-bottom: 0;
      }

      .nav-months {
        width: 100%;
        padding-left: 0;
        display: none;
        flex-wrap: wrap;
        gap: 4px;
        margin-bottom: 0;
        order: 99;
      }

      .nav-months.open { display: flex; }

      .nav-month {
        flex: 0 0 auto;
        width: auto;
      }
    }

    @media screen and (max-width: 479px) {
      .search-input { font-size: 13px; }
      .email-title { font-size: 14px; line-height: 18px; }
      .email-date { font-size: 11px; flex: 0 0 80px; }
    }
  </style>
</head>
<body>
  <div class="archive-wrap">
    <div class="archive-header">
      <a href="/" class="header-home">technoqueers</a>
      <span class="header-sep">/</span>
      <span class="header-label">archive</span>
    </div>

    <div class="archive-search">
      <input type="text" id="search-input" class="search-input" placeholder="search" autocomplete="off" spellcheck="false">
    </div>

    <div class="archive-layout">
      <nav class="archive-nav" id="year-nav" aria-label="Browse by year"></nav>
      <div class="archive-list" id="email-list" aria-live="polite"></div>
    </div>
  </div>

  <script>
  (function () {
    var all = [];
    var activeYear = null;
    var activeMonth = null;
    var query = '';
    var searchIndex = null;
    var searchState = 'idle'; // idle | loading | ready | failed

    fetch('emails/data.json')
      .then(function (r) { return r.json(); })
      .then(function (data) {
        all = data; // already sorted newest-first by build script
        activeYear = all[0].year;
        render();
      });

    document.getElementById('search-input').addEventListener('input', function (e) {
      query = e.target.value.trim().toLowerCase();
      if (query) {
        activeYear = null;
        activeMonth = null;
        loadSearchIndex();
      } else if (!activeYear && all.length) {
        activeYear = all[0].year;
      }
      render();
    });

    /* ── Full-text search ── */

    // Fetched on first search, since it's far bigger than data.json. Until it
    // arrives (or if it fails) search falls back to titles and excerpts.
    function loadSearchIndex() {
      if (searchState === 'loading' || searchState === 'ready') return;
      searchState = 'loading';
      fetch('emails/search.json')
        .then(function (r) {
          if (!r.ok) throw new Error('HTTP ' + r.status);
          return r.json();
        })
        .then(function (index) {
          searchIndex = index;
          searchState = 'ready';
          render();
        })
        .catch(function (err) {
          console.error('Could not load search index', err);
          searchState = 'failed';
          render();
        });
    }

    // Lowercases, strips accents and turns punctuation into spaces, so "vos"
    // finds "Vôs" and "n'" finds "N’". Keeps the length unchanged so a match
    // position also points at the right place in the original text.
    function fold(s) {
      return s.toLowerCase().replace(/[^a-z0-9 ]/g, function (ch) {
        var base = ch.normalize('NFD').charAt(0);
        return /[\p{L}\p{N}]/u.test(base) ? base : ' ';
      });
    }

    function queryWords() {
      return fold(query).split(/\s+/).filter(Boolean);
    }

    function bodyText(c) {
      return searchIndex ? (searchIndex[c.file] || '') : (c.excerpt || '');
    }

    function foldedBody(c) {
      if (!searchIndex) return fold(bodyText(c));
      if (c.foldedBody === undefined) c.foldedBody = fold(bodyText(c));
      return c.foldedBody;
    }

    // A slice of the issue around the match; every issue is titled "the guide
    // v.N", so the title alone can't show why it was found.
    function snippet(c, words) {
      var body = foldedBody(c);
      var length = words.join(' ').length;
      var pos = body.indexOf(words.join(' '));
      for (var i = 0; pos === -1 && i < words.length; i++) {
        length = words[i].length;
        pos = body.indexOf(words[i]);
      }
      if (pos === -1) return '';

      var text = bodyText(c);
      var start = Math.max(0, pos - 70);
      var end = Math.min(text.length, pos + length + 110);
      if (start > 0) {
        var wordStart = text.indexOf(' ', start);
        if (wordStart !== -1 && wordStart < pos) start = wordStart + 1;
      }
      if (end < text.length) {
        var wordEnd = text.lastIndexOf(' ', end);
        if (wordEnd > pos + length) end = wordEnd;
      }
      return (start > 0 ? '… ' : '') + text.slice(start, end) + (end < text.length ? ' …' : '');
    }

    /* ── Data helpers ── */

    function years() {
      var seen = {}, out = [];
      all.forEach(function (c) {
        if (!seen[c.year]) { seen[c.year] = 0; out.push(c.year); }
        seen[c.year]++;
      });
      out.sort(function (a, b) { return b - a; });
      return out.map(function (y) {
        return { year: y, count: all.filter(function (c) { return c.year === y; }).length };
      });
    }

    function monthsForYear(year) {
      var map = {};
      all.forEach(function (c) {
        if (c.year !== year) return;
        if (!map[c.month]) map[c.month] = { num: c.month, name: c.monthName, count: 0 };
        map[c.month].count++;
      });
      return Object.values(map).sort(function (a, b) { return b.num - a.num; });
    }

    function filtered() {
      if (query) {
        var words = queryWords();
        if (!words.length) return [];
        return all.filter(function (c) {
          var meta = fold(c.title + ' ' + c.subject);
          var body = foldedBody(c);
          return words.every(function (w) {
            return meta.indexOf(w) !== -1 || body.indexOf(w) !== -1;
          });
        });
      }
      return all.filter(function (c) {
        if (activeYear && c.year !== activeYear) return false;
        if (activeMonth && c.month !== activeMonth) return false;
        return true;
      });
    }

    /* ── Render nav ── */

    function renderNav() {
      var nav = document.getElementById('year-nav');

      if (query) {
        nav.innerHTML = '';
        return;
      }

      var html = '';
      years().forEach(function (y) {
        var isActive = y.year === activeYear;
        html += '<button class="nav-year' + (isActive ? ' active' : '') +
                '" data-year="' + y.year + '">' +
                y.year + '<span class="nav-count">(' + y.count + ')</span></button>';

        if (isActive) {
          var months = monthsForYear(y.year);
          html += '<div class="nav-months' + (isActive ? ' open' : '') + '">';
          html += '<button class="nav-month' + (!activeMonth ? ' active' : '') +
                  '" data-month="0">All</button>';
          months.forEach(function (m) {
            html += '<button class="nav-month' + (activeMonth === m.num ? ' active' : '') +
                    '" data-month="' + m.num + '">' +
                    m.name + '<span class="nav-count">(' + m.count + ')</span></button>';
          });
          html += '</div>';
        }
      });

      nav.innerHTML = html;

      nav.querySelectorAll('.nav-year').forEach(function (btn) {
        btn.addEventListener('click', function () {
          activeYear = parseInt(this.dataset.year);
          activeMonth = null;
          render();
        });
      });

      nav.querySelectorAll('.nav-month').forEach(function (btn) {
        btn.addEventListener('click', function () {
          var m = parseInt(this.dataset.month);
          activeMonth = m || null;
          render();
        });
      });
    }

    /* ── Render list ── */

    function renderList() {
      var list = document.getElementById('email-list');
      var items = filtered();

      if (!items.length) {
        list.innerHTML = '<div class="list-empty">' +
                         (query && searchState === 'loading' ? 'searching…' :
                          query && searchState === 'failed' ? 'no results in titles — full text failed to load' :
                          'no results') +
                         '</div>';
        return;
      }

      var html = '';

      if (query) {
        var words = queryWords();
        var note = searchState === 'loading' ? ' — searching full text…' :
                   searchState === 'failed' ? ' — titles only, full text failed to load' : '';
        html += '<div class="list-status">' + items.length +
                ' result' + (items.length !== 1 ? 's' : '') + note + '</div>';
        items.forEach(function (c) { html += emailRow(c, snippet(c, words)); });
        list.innerHTML = html;
        return;
      }

      if (activeMonth) {
        /* Month view — group by week */
        var weekGroups = {};
        var weekOrder = [];
        items.forEach(function (c) {
          var k = c.year + '-W' + pad(c.week);
          if (!weekGroups[k]) { weekGroups[k] = []; weekOrder.push(k); }
          weekGroups[k].push(c);
        });

        weekOrder.forEach(function (k) {
          var weekNum = parseInt(k.split('-W')[1]);
          html += '<div class="group-header">Week ' + weekNum + '</div>';
          weekGroups[k].forEach(function (c) { html += emailRow(c); });
        });
      } else {
        /* Year view — group by month */
        var monthGroups = {};
        var monthOrder = [];
        items.forEach(function (c) {
          var k = c.year + '-' + pad(c.month);
          if (!monthGroups[k]) { monthGroups[k] = []; monthOrder.push(k); }
          monthGroups[k].push(c);
        });

        monthOrder.forEach(function (k) {
          var sample = monthGroups[k][0];
          html += '<div class="group-header">' + sample.monthName + ' ' + sample.year + '</div>';
          monthGroups[k].forEach(function (c) { html += emailRow(c); });
        });
      }

      list.innerHTML = html;
    }

    function emailRow(c, excerpt) {
      return '<div class="email-item">' +
             '<span class="email-date">' + c.date + '</span>' +
             '<div class="email-body">' +
             '<a href="emails/' + esc(c.file) + '" class="email-title" target="_blank" rel="noopener">' +
             esc(c.title) + '</a>' +
             (excerpt ? '<div class="email-snippet">' + esc(excerpt) + '</div>' : '') +
             '</div>' +
             '</div>';
    }

    function render() {
      renderNav();
      renderList();
    }

    function pad(n) { return n < 10 ? '0' + n : '' + n; }

    function esc(s) {
      return String(s)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }
  }());
  </script>
</body>
</html>
