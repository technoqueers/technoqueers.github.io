name = "technoqueers-admin"
main = "src/index.js"
compatibility_date = "2026-10-01"
workers_dev = true
# Per-version preview URLs would be a second address to protect; turn them off.
preview_urls = false

# Nothing here is secret. GITHUB_TOKEN and ALLOWED_EMAILS are set with
# `npx wrangler secret put` so they never land in this public repo.
[vars]
GITHUB_REPO = "technoqueers/technoqueers.github.io"
GITHUB_BRANCH = "master"
SITE_URL = "https://technoqueers.com"
# Filled in during setup (see README.md in this folder):
ACCESS_TEAM_DOMAIN = ""   # e.g. "technoqueers.cloudflareaccess.com"
ACCESS_AUD = ""           # the Access application's "Application Audience (AUD) Tag"
